<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz pokémon</title>
    <link rel="stylesheet" href="./css/pages/css-home/main.css">
    <link rel="stylesheet" href="./css/pages/css-home/fundo.css">
    <link rel="stylesheet" href="./css/pages/css-home/botao.css">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="titulo">
        <img src="./assets/images/ícone_pokebola_vermelha.png" class="pokebola">
        <h1>Pokequiz</h1>
        </div>
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                <img src="./assets/images/kyogre.png" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                <img src="./assets/images/groudon.png" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                <img src="./assets/images/zygarde.png" class="d-block w-100" alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    <br>
    <h2>neste quiz de pokemon vamos passar por varios momentos <br> importantes da franquia desde jogos, animes, cartas e muito mais <br> tudo para descobrir qual seria o seu tipo no universo de pokemon<br> preparado para a aventura?</h2>
    <br>
    <div class="grid">
        <div><img src="./assets/images/texto1.png" class="imageGrid"></div>
        <div><img src="./assets/images/bg_pokebola.jpg" class="imageGrid"></div>
        <div><img src="./assets/images/ash.webp" class="ash"><img src="./assets/images/mew.png" class="mew"></div>
        <div><img src="./assets/images/texto2.png" class="imageGrid"></div>
    </div>

    <div class="bg_img"> 
        <button class="avancar">
            <div>
                <h1>Continuar </h1>
                <h1>&rarr;</h1>
            </div>
        </button>
        <img src="./assets/images/bg_pokemonChampions.jpg" class="bg_champions">    
    </div>
    </main>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
