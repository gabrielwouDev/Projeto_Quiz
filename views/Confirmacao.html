<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/pages/css-confirmacao/fundo.css"> 
    <link rel="stylesheet" href="../css/pages/css-confirmacao/main.css"> 
    <link rel="stylesheet" href="../css/perguntas/moldura.css">
    <link rel="stylesheet" href="../css/pages/css-home/botão.css"> 
    <title>Confirmar</title>
</head>
<body>
    <div class="fundo">
        <img src="../assets/images/Rotom_perguntas2.png" class="moldura">
        <main>
            <h1>Você escolheu as seguintes alternativas:</h1>

            <div class="confirmacao">
                <div class="campo">
                    <label></label>
                    <select id="p1">
                        <option value="fogo">Giovanni</option>
                        <option value="eletrico">Kissera</option>
                        <option value="grama">Fruta Sitrus</option>
                        <option value="agua">Capa Gigante</option>
                    </select>
                </div>

                <div class="campo">
                    <label></label>
                    <select id="p2">
                        <option value="eletrico">Investida</option>
                        <option value="fogo">Mordida</option>
                        <option value="agua">Enrolar</option>
                        <option value="grama">Cabeçada</option>
                    </select>
                </div>

                <div class="campo">
                    <label></label>
                    <select id="p3">
                        <option value="fogo">Corredor cheio de batalhas consecutivas.</option>
                        <option value="grama">Floresta onde cada escolha altera o caminho..</option>
                        <option value="agua">Labirinto com mecanismos e enigmas..</option>
                        <option value="eletrico">Sala tecnológica cheia de armadilhas rápidas.</option>
                    </select>
                </div>

                <div class="campo">
                    <label></label>
                    <select id="p4">
                        <option value="grama">Observar o ambiente ao redor e planejar a melhor abordagem.</option>
                        <option value="fogo">Entrar em ação imediatamente e tentar capturá-lo sem hesitar.</option>
                        <option value="agua">Analisar o comportamento do Pokémon antes de tomar qualquer decisão.</option>
                        <option value="eletrico">Testar rapidamente diferentes estratégias e recursos disponíveis no jogo.</option>
                    </select>
                </div>

                <div class="campo">
                    <label></label>
                    <select id="p5">
                        <option value="agua">Jogar uma pokebola</option>
                        <option value="grama">Jogar uma fruta</option>
                        <option value="fogo">Iniciar uma batalha</option>
                        <option value="eletrico">Correr</option>
                    </select>
                </div>
            </div>
            <img src="../assets/images/jirachi.webp" width="500px" height="auto" class="jirachi">
            <a class="link-botao" id="botao-confirmacao">
                <button>
                    <div>
                        <h1>Confirmar</h1>
                        <h1>&rarr;</h1>
                    </div>
                </button>
            </a>
        </main>
    </div>
    <script type="module" src="../script/puxarDados.js"></script>
</body>
</html>
